stages:
  - build
  - migrate
  - deploy

variables:
  MIGRATE_IMAGE: migrate/migrate:v4.18.3
  COMPOSE_SERVICE: interview-service
  MIGRATIONS_TABLE: interview_schema_migrations

build:
  stage: build
  image: golang:1.25-alpine
  tags: [interverse, prod]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache git
  script:
    - go build ./...

migrate:
  stage: migrate
  image: $MIGRATE_IMAGE
  tags: [interverse, prod]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs: [build]
  script:
    - migrate -path migrations
      -database "${DATABASE_URL}&x-migrations-table=${MIGRATIONS_TABLE}" up

deploy:prod:
  stage: deploy
  tags: [interverse, prod]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs: [migrate]
  script:
    - cd "${INFRASTRUCTURE_DIR}"
    - docker compose -f docker-compose.prod.yml up -d --build ${COMPOSE_SERVICE}
    - docker compose -f docker-compose.prod.yml ps ${COMPOSE_SERVICE}
